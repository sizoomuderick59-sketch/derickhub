version: '3.8'

services:
  web:
    build: .
    container_name: maize_ai_advisor_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-default-insecure-prod-key-please-change}
      - DATABASE_URL=postgresql://maize_user:maize_pass@db:5432/maize_advisor
      - MODEL_PATH=/app/data/models/maize_model_v1.pth
      - MODEL_VERSION=maize-mobilenet-v1.0
      - CONFIDENCE_THRESHOLD=0.70
      - LLM_PROVIDER=expert
    volumes:
      - uploads_data:/app/app/static/uploads
      - models_data:/app/data/models
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: maize_ai_advisor_db
    restart: always
    environment:
      POSTGRES_DB: maize_advisor
      POSTGRES_USER: maize_user
      POSTGRES_PASSWORD: maize_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
  uploads_data:
  models_data:
